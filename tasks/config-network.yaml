---
- name: Configure network interfaces
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    backup: true
    owner: root
    group: root
    mode: 0644
  become: true
  notify: Restart network interfaces

- name: Configure network interface names
  ansible.builtin.template:
    src: link.j2
    dest: /etc/systemd/network/10-persistent_{{ item.interface_name }}.link
    owner: root
    group: root
    mode: 0644
  with_items:
    - "{{ pve_network_interface_alias }}"
  when: pve_network_interface_alias is defined
  become: true
  notify: Reboot host

- name: Setup SDN support on Proxmox
  become: true
  block:
    - name: Install SDN support packages
      ansible.builtin.apt:
        package:
          - libpve-network-perl
          - dnsmasq
          - frr-pythontools
        state: present
        update_cache: true

    - name: Disable the default dnsmasq instance
      ansible.builtin.systemd_service:
        name: dnsmasq
        state: stopped
        enabled: false
